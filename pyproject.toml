[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamanager"
version = "0.1.0"
description = "Deterministic search over personal documents on a NAS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Format handlers. Absent, the matching document types degrade to a 'partial'
# status rather than an error (FR-2), so the core stays installable anywhere.
formats = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.0",
]
# OCR for screenshots and scanned PDFs. On macOS the built-in Vision engine is
# used and needs only these bindings; elsewhere install tesseract plus
# pytesseract, and poppler (pdftoppm) to rasterise scanned PDFs.
ocr-macos = [
    "pyobjc-framework-Vision>=10.0",
    "pyobjc-framework-Quartz>=10.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]
# Photo tagging: EXIF plus offline reverse geocoding (no network, no API key).
photos = [
    "pillow>=10.0",
    "reverse_geocoder>=1.5",
]
# Semantic search. Absent, search falls back to keyword-only (NFR-9).
semantic = [
    "sentence-transformers>=3.0",
]
# Web UI and REST API.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
dm = "datamanager.cli:main"
dm-mcp = "datamanager.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datamanager = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
